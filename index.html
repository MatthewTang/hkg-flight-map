<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>HKG Routes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { margin: 0; height: 100%; background: #0b0e14; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .leaflet-container { background: #0b0e14 !important; }
    .hud {
      position: absolute; z-index: 1000; left: 12px; right: 12px;
      top: max(10px, env(safe-area-inset-top));
      background: rgba(18,22,30,.9); color: #e8eef6; padding: 10px 14px;
      border-radius: 12px; border: 1px solid #243044; pointer-events: none;
    }
    .hud h1 { margin: 0; font-size: 15px; }
    .hud p { margin: 2px 0 0; font-size: 11px; color: #8b98ab; }
    .apt { background: none !important; border: none !important; }
    .apt span { font: 600 11px ui-monospace, SFMono-Regular, monospace; text-shadow: 0 0 6px #0b0e14; }
  </style>
</head>
<body>
<div class="hud">
  <h1>Flight roster (Jan–Sep 2026)</h1>
  <p>Pacific-centered — Americas sit east of HKG, same as Flightradar / GCMap</p>
</div>
<div id="map"></div>
<script>
const SEAM = 150;
const HKG = { lat: 22.308, lng: 113.9185 };
function wrap(lng) { return lng - 360 * Math.floor((lng - SEAM + 180) / 360); }
function xyz(lat, lng) {
  const p = lat * Math.PI/180, l = lng * Math.PI/180, c = Math.cos(p);
  return [c*Math.cos(l), c*Math.sin(l), Math.sin(p)];
}
function greatCircle(to, n=128) {
  const a = xyz(HKG.lat, HKG.lng), b = xyz(to.lat, to.lng);
  const dot = Math.min(1, Math.max(-1, a[0]*b[0]+a[1]*b[1]+a[2]*b[2]));
  const w = Math.acos(dot), s = Math.sin(w), pts = [];
  if (w < 1e-8) return [[HKG.lat, wrap(HKG.lng)]];
  for (let i=0;i<=n;i++) {
    const t=i/n, s1=Math.sin((1-t)*w)/s, s2=Math.sin(t*w)/s;
    const x=s1*a[0]+s2*b[0], y=s1*a[1]+s2*b[1], z=s1*a[2]+s2*b[2];
    const lat = Math.atan2(z, Math.hypot(x,y))*180/Math.PI;
    const lng = Math.atan2(y,x)*180/Math.PI;
    pts.push([lat, wrap(lng)]);
  }
  return pts;
}
function color(n){ return n>=5?'#fb7185':n>=3?'#fb923c':n>=2?'#fbbf24':'#38bdf8'; }
function weight(n){ return n>=5?3.6:n>=3?2.6:n>=2?2:1.4; }
const dests = [
  {code:'JFK',city:'New York',lat:40.6413,lng:-73.7781,count:5},
  {code:'DEL',city:'Delhi',lat:28.5562,lng:77.1,count:3},
  {code:'YYZ',city:'Toronto',lat:43.6777,lng:-79.6248,count:3},
  {code:'SFO',city:'San Francisco',lat:37.6213,lng:-122.379,count:3},
  {code:'YVR',city:'Vancouver',lat:49.1967,lng:-123.1815,count:2},
  {code:'MAA',city:'Chennai',lat:12.9941,lng:80.1709,count:2},
  {code:'TPE',city:'Taipei',lat:25.0797,lng:121.2342,count:2},
  {code:'MEL',city:'Melbourne',lat:-37.669,lng:144.841,count:1},
  {code:'PER',city:'Perth',lat:-31.9403,lng:115.9669,count:1},
  {code:'JNB',city:'Johannesburg',lat:-26.1367,lng:28.2411,count:1},
  {code:'CTS',city:'Sapporo',lat:42.7752,lng:141.6923,count:1},
  {code:'CHC',city:'Christchurch',lat:-43.4864,lng:172.5369,count:1},
  {code:'FOC',city:'Fuzhou',lat:25.9351,lng:119.6633,count:1},
  {code:'WUH',city:'Wuhan',lat:30.7838,lng:114.2081,count:1},
  {code:'HGH',city:'Hangzhou',lat:30.2295,lng:120.4344,count:1},
  {code:'ZRH',city:'Zurich',lat:47.4582,lng:8.5555,count:1},
  {code:'MNL',city:'Manila',lat:14.5086,lng:121.0194,count:1},
  {code:'DFW',city:'Dallas',lat:32.8998,lng:-97.0403,count:1},
  {code:'MAN',city:'Manchester',lat:53.3588,lng:-2.2727,count:1},
  {code:'CGK',city:'Jakarta',lat:-6.1275,lng:106.6557,count:1},
  {code:'BCN',city:'Barcelona',lat:41.2974,lng:2.0785,count:1},
  {code:'ORD',city:'Chicago',lat:41.9742,lng:-87.9073,count:1}
];
const mobile = innerWidth < 700;
const map = L.map('map', {
  center: [32, 205], zoom: mobile ? 1.55 : 2.35,
  minZoom: 1, maxZoom: 8, zoomSnap: 0.25, worldCopyJump: false, zoomControl: true, preferCanvas: true
});
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles © Esri', maxZoom: 16, noWrap: false
}).addTo(map);
const hkgLng = wrap(HKG.lng);
L.circleMarker([HKG.lat, hkgLng], {radius:8,color:'#fff',weight:2,fillColor:'#38bdf8',fillOpacity:1}).addTo(map).bindPopup('<b>HKG</b>');
L.marker([HKG.lat, hkgLng], {interactive:false, icon: L.divIcon({className:'apt', html:'<span style="color:#7dd3fc">HKG</span>', iconSize:[40,14], iconAnchor:[20,-8]})}).addTo(map);
dests.forEach(d => {
  const path = greatCircle(d);
  const c = color(d.count), w = weight(d.count);
  L.polyline(path, {color:c, weight:w, opacity:0.9, lineCap:'round'}).addTo(map);
  const lng = wrap(d.lng);
  L.circleMarker([d.lat, lng], {radius: d.count>=3?7:5, color:'#0b0e14', weight:1.5, fillColor:c, fillOpacity:1})
    .addTo(map).bindPopup('<b>'+d.code+'</b> · '+d.city+'<br>'+d.count+' flights');
  L.marker([d.lat, lng], {interactive:false, icon: L.divIcon({className:'apt', html:'<span style="color:'+c+'">'+d.code+'</span>', iconSize:[44,14], iconAnchor:[22,-7]})}).addTo(map);
});
</script>
</body>
</html>
