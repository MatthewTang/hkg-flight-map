<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Flight Map from Hong Kong</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: #0b0e14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #map { position: absolute; inset: 0; background: #0b0e14; }
        .leaflet-container { background: #0b0e14 !important; }
        .map-title {
            position: absolute;
            top: max(10px, env(safe-area-inset-top));
            left: 56px;
            right: 12px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
        }
        .map-title h2 { margin: 0 0 2px; font-size: 15px; font-weight: 600; color: #38bdf8; }
        .map-title p { margin: 0; font-size: 11px; color: #94a3b8; line-height: 1.35; }
        .legend {
            position: absolute;
            bottom: max(28px, env(safe-area-inset-bottom));
            left: 10px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.88);
            color: #cbd5e1;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 11px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .legend div { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
        .legend i { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
        .leaflet-control-zoom { margin-left: 10px !important; margin-top: max(10px, env(safe-area-inset-top)) !important; }
        .leaflet-control-attribution { font-size: 10px !important; }
    </style>
</head>
<body>
<div class="map-title">
    <h2>Flight Route Map (Jan–Sep 2026)</h2>
    <p>HKG hub • thickness &amp; color = frequency</p>
</div>
<div class="legend">
    <div><i style="background:#f43f5e;height:4px"></i> 5+ flights</div>
    <div><i style="background:#fb923c;height:3px"></i> 3–4</div>
    <div><i style="background:#facc15"></i> 2</div>
    <div><i style="background:#38bdf8"></i> 1</div>
</div>
<div id="map"></div>
<script>
    const HKG_LNG = 113.9185;
    const HKG_LAT = 22.3080;

    const map = L.map('map', {
        center: [HKG_LAT, HKG_LNG],
        zoom: 3,
        minZoom: 2,
        maxZoom: 8,
        worldCopyJump: false
    });

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles © Esri — source: Esri, HERE, Garmin',
        maxZoom: 16,
        noWrap: false
    }).addTo(map);

    const destinations = [
        { code: "JFK", name: "New York (JFK)", lat: 40.6413, lng: -73.7781, count: 5 },
        { code: "DEL", name: "Delhi (DEL)", lat: 28.5562, lng: 77.1000, count: 3 },
        { code: "YYZ", name: "Toronto (YYZ)", lat: 43.6777, lng: -79.6248, count: 3 },
        { code: "SFO", name: "San Francisco (SFO)", lat: 37.6213, lng: -122.3790, count: 3 },
        { code: "YVR", name: "Vancouver (YVR)", lat: 49.1967, lng: -123.1815, count: 2 },
        { code: "MAA", name: "Chennai (MAA)", lat: 12.9941, lng: 80.1709, count: 2 },
        { code: "TPE", name: "Taipei (TPE)", lat: 25.0797, lng: 121.2342, count: 2 },
        { code: "MEL", name: "Melbourne (MEL)", lat: -37.6690, lng: 144.8410, count: 1 },
        { code: "PER", name: "Perth (PER)", lat: -31.9403, lng: 115.9669, count: 1 },
        { code: "JNB", name: "Johannesburg (JNB)", lat: -26.1367, lng: 28.2411, count: 1 },
        { code: "CTS", name: "Sapporo (CTS)", lat: 42.7752, lng: 141.6923, count: 1 },
        { code: "CHC", name: "Christchurch (CHC)", lat: -43.4864, lng: 172.5369, count: 1 },
        { code: "FOC", name: "Fuzhou (FOC)", lat: 25.9351, lng: 119.6633, count: 1 },
        { code: "WUH", name: "Wuhan (WUH)", lat: 30.7838, lng: 114.2081, count: 1 },
        { code: "HGH", name: "Hangzhou (HGH)", lat: 30.2295, lng: 120.4344, count: 1 },
        { code: "ZRH", name: "Zurich (ZRH)", lat: 47.4582, lng: 8.5555, count: 1 },
        { code: "MNL", name: "Manila (MNL)", lat: 14.5086, lng: 121.0194, count: 1 },
        { code: "DFW", name: "Dallas (DFW)", lat: 32.8998, lng: -97.0403, count: 1 },
        { code: "MAN", name: "Manchester (MAN)", lat: 53.3588, lng: -2.2727, count: 1 },
        { code: "CGK", name: "Jakarta (CGK)", lat: -6.1275, lng: 106.6557, count: 1 },
        { code: "BCN", name: "Barcelona (BCN)", lat: 41.2974, lng: 2.0785, count: 1 },
        { code: "ORD", name: "Chicago (ORD)", lat: 41.9742, lng: -87.9073, count: 1 }
    ];

    function getColor(count) {
        return count >= 5 ? '#f43f5e' : count >= 3 ? '#fb923c' : count >= 2 ? '#facc15' : '#38bdf8';
    }
    function getWeight(count) {
        return count >= 5 ? 3.5 : count >= 3 ? 2.5 : count >= 2 ? 1.8 : 1.2;
    }

    // Place longitudes on the same world copy as HKG so Pacific routes go east.
    function lngNearHkg(lng) {
        let x = lng;
        while (x - HKG_LNG > 180) x -= 360;
        while (x - HKG_LNG < -180) x += 360;
        return x;
    }

    function unwrapFromHkg(coords) {
        const pts = [];
        let prev = HKG_LNG;
        for (const [lng, lat] of coords) {
            let x = lng;
            while (x - prev > 180) x -= 360;
            while (x - prev < -180) x += 360;
            pts.push([lat, x]);
            prev = x;
        }
        return pts;
    }

    L.circleMarker([HKG_LAT, HKG_LNG], {
        radius: 7, fillColor: '#38bdf8', color: '#fff', weight: 2, fillOpacity: 0.95
    }).addTo(map).bindPopup('<b>Hub: Hong Kong (HKG)</b>');

    const bounds = L.latLngBounds([[HKG_LAT, HKG_LNG]]);

    destinations.forEach(dest => {
        const gc = turf.greatCircle(
            turf.point([HKG_LNG, HKG_LAT]),
            turf.point([dest.lng, dest.lat]),
            { npoints: 128 }
        );
        const latLngs = unwrapFromHkg(gc.geometry.coordinates);
        L.polyline(latLngs, {
            color: getColor(dest.count),
            weight: getWeight(dest.count),
            opacity: 0.85,
            lineCap: 'round'
        }).addTo(map);

        const destLng = lngNearHkg(dest.lng);
        L.circleMarker([dest.lat, destLng], {
            radius: dest.count >= 3 ? 6 : 5,
            fillColor: getColor(dest.count),
            color: '#0f172a',
            weight: 1,
            fillOpacity: 0.9
        }).addTo(map).bindPopup('<b>' + dest.name + '</b><br>Flights: <b>' + dest.count + '</b>');

        bounds.extend([dest.lat, destLng]);
    });

    map.fitBounds(bounds, { padding: [36, 36], maxZoom: 3 });
</script>
</body>
</html>
